# Builds the Docker image, pushes it to Artifact Registry, and deploys to Cloud Run.
#
# Manual run:
#   gcloud builds submit --config cloudbuild.yaml \
#     --substitutions=_CONTACT_EMAIL=you@example.org,_SPREADSHEET_ID=...,_SHEETS_SA_EMAIL=...
#
# Or attach it to a Cloud Build trigger on pushes to main and set the
# substitution values in the trigger settings.
#
# One-time setup: see "Deploy to Google Cloud Run" in README.md.

substitutions:
  _REGION: us-central1
  _SERVICE: rank-america
  _AR_REPO: rank-america
  # Baked into the bundle at build time (public, non-secret).
  _CONTACT_EMAIL: ""
  _PAYPAL_URL: ""
  # Server-only runtime config. The private key itself lives in Secret Manager.
  _SPREADSHEET_ID: ""
  _SHEETS_SA_EMAIL: ""
  _PRIVATE_KEY_SECRET: google-private-key

options:
  logging: CLOUD_LOGGING_ONLY

images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/${_SERVICE}:$BUILD_ID
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/${_SERVICE}:latest

steps:
  - id: build
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - --build-arg=NEXT_PUBLIC_CONTACT_EMAIL=${_CONTACT_EMAIL}
      - --build-arg=NEXT_PUBLIC_PAYPAL_DONATION_URL=${_PAYPAL_URL}
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/${_SERVICE}:$BUILD_ID
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/${_SERVICE}:latest
      - .

  - id: push
    name: gcr.io/cloud-builders/docker
    args: [push, --all-tags, "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/${_SERVICE}"]

  # The private-key secret is only attached once a spreadsheet ID is configured,
  # so the site can be deployed before Google Sheets signups are set up.
  - id: deploy
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        secret_flag="--clear-secrets"
        if [ -n "${_SPREADSHEET_ID}" ]; then
          secret_flag="--set-secrets=GOOGLE_PRIVATE_KEY=${_PRIVATE_KEY_SECRET}:latest"
        fi
        gcloud run deploy "${_SERVICE}" \
          --image="${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/${_SERVICE}:$BUILD_ID" \
          --region="${_REGION}" \
          --platform=managed \
          --allow-unauthenticated \
          --port=8080 \
          --set-env-vars="^@^GOOGLE_SPREADSHEET_ID=${_SPREADSHEET_ID}@GOOGLE_SERVICE_ACCOUNT_EMAIL=${_SHEETS_SA_EMAIL}@NEXT_PUBLIC_CONTACT_EMAIL=${_CONTACT_EMAIL}@NEXT_PUBLIC_PAYPAL_DONATION_URL=${_PAYPAL_URL}" \
          "$$secret_flag"
